name: Frontend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-ui
          path: dist/

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: scheduler-ui
          path: deploy-artifact

      - name: Prepare deployment files
        run: |
          rm -rf /home/github-runner/deploy/scheduler-ui
          mkdir -p /home/github-runner/deploy/scheduler-ui
          cp -a deploy-artifact/. /home/github-runner/deploy/scheduler-ui/

      - name: Deploy application
        run: sudo /usr/local/sbin/deploy-scheduler-ui
